<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>SoftMath</title>
  </head>
  <body>
    <header class="header"><h1>SoftMath</h1></header>

    <main id="main-content">
      <section class="calculator">
        <div class="calculator__screenContainer">
          <span class="calculator__operator--value"></span>
          <input
            type="text"
            class="calculator__display"
            readonly
            aria-label="Calculator Display"
            value="0"
          />
        </div>

        <div class="calculator__btns">
          <div class="calculator__row">
            <button
              class="calculator__btn calculator__btn--clear"
              data-action="clear"
              data-value="clear"
            >
              AC</button
            ><button
              class="calculator__btn calculator__btn--clear"
              data-action="percentage"
              data-value="%"
            >
              %
            </button>
            <button
              class="calculator__btn calculator__btn--clear"
              data-action="backspace"
              data-value="backspace"
            >
              ⌫
            </button>
            <button
              class="calculator__btn calculator__btn--operator"
              data-action="operator"
              data-value="/"
            >
              ÷
            </button>
          </div>

          <div class="calculator__row">
            <button class="calculator__btn" data-action="number" data-value="7">
              7
            </button>
            <button class="calculator__btn" data-action="number" data-value="8">
              8
            </button>
            <button class="calculator__btn" data-action="number" data-value="9">
              9
            </button>
            <button
              class="calculator__btn calculator__btn--operator"
              data-action="operator"
              data-value="*"
            >
              ×
            </button>
          </div>
          <div class="calculator__row">
            <button class="calculator__btn" data-action="number" data-value="4">
              4
            </button>
            <button class="calculator__btn" data-action="number" data-value="5">
              5
            </button>
            <button class="calculator__btn" data-action="number" data-value="6">
              6
            </button>
            <button
              class="calculator__btn calculator__btn--operator"
              data-action="operator"
              data-value="-"
            >
              -
            </button>
          </div>

          <div class="calculator__row">
            <button class="calculator__btn" data-action="number" data-value="1">
              1
            </button>
            <button class="calculator__btn" data-action="number" data-value="2">
              2
            </button>
            <button class="calculator__btn" data-action="number" data-value="3">
              3
            </button>
            <button
              class="calculator__btn calculator__btn--operator"
              data-action="operator"
              data-value="+"
            >
              +
            </button>
          </div>

          <div class="calculator__row ">
            <button
              class="calculator__btn calculator__btn--zero"
              data-action="number"
              data-value="0"
            >
              0
            </button>
            <button class="calculator__btn" data-action="decimal">.</button>
            <button
              class="calculator__btn calculator__btn--equals"
              data-action="equals"
              data-value="="
            >
              =
            </button>
            
        </div>
      </section>
    </main>

    <footer class="footer">© 2026 SoftMath. All rights reserved.</footer>
  </body>
  <script src="./js/app.js"></script>
</html>
